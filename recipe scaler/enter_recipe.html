<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enter Recipe Manually</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <header>
    <h1>Recipe <span style="color: #F2D479; font-style: italic;">Scaler</span></h1>
    <p>Enter Your Ingredients</p>
  </header>

  <div class="main-content">
    <div class="card">
      <h2>Recipe Details</h2>
      <input type="text" id="recipeName" placeholder="Recipe Name" />
      <input type="text" id="mainIngredient" placeholder="Main Ingredient" />
    </div>

    <div class="card">
      <h2>Ingredients</h2>
      <div id="recipeIngredientsList"></div>
      <button onclick="addIngredient()" class="secondary-btn">Add Ingredient</button>
    </div>

    <div class="card">
      <h2>📝 Cooking Notes & Instructions</h2>
      <div class="notes-input-group">
        <label for="recipeNotes">Cooking Notes:</label>
        <textarea id="recipeNotes" placeholder="Add any cooking notes or tips..." rows="4"></textarea>
      </div>
      <div class="notes-input-group">
        <label for="recipeInstructions">Instructions/Steps:</label>
        <div id="instructionsSteps"></div>
        <button onclick="addInstructionStep()" class="secondary-btn">+ Add Step</button>
      </div>
    </div>

    <div class="scale-options" style="flex-direction: column;">
      <h2 style="width: 100%; text-align: center; margin-bottom: 20px;">Scaling Options</h2>
      
      <div class="quick-scale-container" style="width: 100%; margin-bottom: 15px;">
        <div class="quick-scale-chips">
          <button class="scale-chip" onclick="setQuickScale(0.5, this)">½×</button>
          <button class="scale-chip active" onclick="setQuickScale(1, this)">1×</button>
          <button class="scale-chip" onclick="setQuickScale(2, this)">2×</button>
          <button class="scale-chip" onclick="setQuickScale(3, this)">3×</button>
          <button class="scale-chip" onclick="showCustomScale(this)">Custom</button>
        </div>
      </div>

      <div class="scale-controls" id="custom-scale-controls" style="display: none; width: 100%; justify-content: center; flex-wrap: wrap;">
        <label for="scalingOption">Scale By:</label>
        <select id="scalingOption">
          <option value="servings">Servings</option>
          <option value="quantity">Quantity</option>
        </select>
        <input type="number" id="scalingValue" value="1" min="0.1" step="0.1" />
        <button onclick="scaleRecipe()" class="scale-btn" style="margin-top: 15px;">Scale Recipe</button>
      </div>
    </div>

    <div class="nav-buttons">
      <button onclick="window.location.href='index.html'" class="secondary-btn">Back to Home</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="recipe-enhancements.js"></script>
  <script>
    window.setQuickScale = function(multiplier, btn) {
      document.querySelectorAll('.scale-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const customControls = document.getElementById('custom-scale-controls');
      if(customControls) customControls.style.display = 'none';
      
      document.getElementById('scalingOption').value = 'servings';
      document.getElementById('scalingValue').value = multiplier;
      if (typeof scaleRecipe === 'function') scaleRecipe();
    };
    
    window.showCustomScale = function(btn) {
      document.querySelectorAll('.scale-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const customControls = document.getElementById('custom-scale-controls');
      if(customControls) customControls.style.display = 'flex';
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Scaler</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
  <header>
    <h1>Recipe <span style="color: #F2D479; font-style: italic;">Scaler</span></h1>
    <p>Scale ingredients from YouTube videos or your own recipes</p>
  </header>

  <div class="main-content">
    <div class="card">
      <div style="text-align: center; margin-bottom: 20px;">
        <span class="step-badge">1 — Find your recipe</span>
      </div>
      <div class="search-container">
        <div class="search-tabs">
          <button class="search-tab active" data-tab="direct-link">Direct Link</button>
          <button class="search-tab" data-tab="search-youtube"><i class="fab fa-youtube"></i> Search YouTube</button>
        </div>

        <div class="tab-content active" id="direct-link">
          <div class="url-input-row">
            <input type="text" id="youtubeLink" placeholder="Enter YouTube Video URL">
            <button class="icon-submit-btn" onclick="fetchIngredients()"><i class="fas fa-arrow-right"></i></button>
          </div>
          <p class="muted-helper">AI will extract ingredients from the video transcript</p>
        </div>

        <div class="tab-content" id="search-youtube">
          <div class="search-form">
            <input type="text" id="searchQuery" placeholder="Search for recipes on YouTube">
            <select id="recipeCategory">
              <option value="">All Categories</option>
              <option value="chicken">Chicken</option>
              <option value="beef">Beef</option>
              <option value="vegetarian">Vegetarian</option>
              <option value="vegan">Vegan</option>
              <option value="dessert">Dessert</option>
              <option value="breakfast">Breakfast</option>
              <option value="pasta">Pasta</option>
              <option value="soup">Soup</option>
            </select>
            <button onclick="searchYouTube()"><i class="fab fa-youtube"></i> Search YouTube</button>
          </div>
          <div id="searchResults"></div>
          <div id="pagination"></div>
        </div>
      </div>
      <div id="loading" class="loading"></div>
    </div>

    <div id="thumbnailContainer"></div>
    <div id="ingredientsList" class="fade-in"></div>

    <div class="translate-section card" style="margin-top: 20px; display: none;" id="translateSection">
      <h3 style="margin-top: 0;">Optional: Translate Ingredients</h3>
      <div class="translate-controls" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <label for="translateLanguage" style="font-weight: 500;">Translate To:</label>
        <select id="translateLanguage" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
          <option value="english">English</option>
          <option value="malayalam">Malayalam</option>
        </select>
        <button id="translateBtn" class="secondary-btn" style="margin: 0;">
          Translate Ingredients
        </button>
      </div>
    </div>

    <div class="scale-options" style="flex-direction: column;">
      <div style="text-align: center; margin-bottom: 20px; width: 100%;">
        <span class="step-badge">2 — Scale Recipe</span>
      </div>
      
      <div class="quick-scale-container" style="width: 100%; margin-bottom: 15px;">
        <div class="quick-scale-chips">
          <button class="scale-chip" onclick="setQuickScale(0.5, this)">½×</button>
          <button class="scale-chip active" onclick="setQuickScale(1, this)">1×</button>
          <button class="scale-chip" onclick="setQuickScale(2, this)">2×</button>
          <button class="scale-chip" onclick="setQuickScale(3, this)">3×</button>
          <button class="scale-chip" onclick="showCustomScale(this)">Custom</button>
        </div>
      </div>

      <div class="scale-controls" id="custom-scale-controls" style="display: none; width: 100%; justify-content: center; flex-wrap: wrap;">
        <label for="scalingOption">Adjust By:</label>
        <select id="scalingOption" onchange="updateScalingOptions()">
          <option value="servings">Servings</option>
          <option value="available">Available Ingredients</option>
        </select>

        <div id="standard-scaling" class="scaling-method">
          <input type="number" id="scalingValue" value="1" min="0.1" step="0.1">
        </div>

        <div id="available-scaling" class="scaling-method" style="display:none; width: 100%;">
          <select id="availableIngredient" style="width: 100%; margin-bottom: 10px;"></select>
          
          <div class="quick-scale-chips" id="available-quick-chips" style="margin-bottom: 15px; justify-content: center;">
            <button class="scale-chip" onclick="setAvailableQuickScale(0.25, this)">1/4×</button>
            <button class="scale-chip" onclick="setAvailableQuickScale(0.5, this)">1/2×</button>
            <button class="scale-chip active" onclick="setAvailableQuickScale(1, this)">1×</button>
            <button class="scale-chip" onclick="setAvailableQuickScale(2, this)">2×</button>
            <button class="scale-chip" onclick="setAvailableQuickScale(3, this)">3×</button>
            <button class="scale-chip" onclick="showAvailableCustom(this)">Custom</button>
          </div>

          <div id="available-custom-input" style="display: none; margin-bottom: 15px;">
            <input type="number" id="availableAmount" placeholder="Enter amount available" min="0.1" step="0.1" style="width: 100%;">
          </div>
        </div>


        <button class="scale-btn" onclick="scaleRecipe()">Scale Ingredients</button>
      </div>
    </div>

    <div class="card">
      <h2>Or Create Your Own</h2>
      <button id="enterRecipeManually" class="secondary-btn">Enter Recipe Manually</button>
    </div>

    <div id="saved-recipes" class="card" style="display:none">
      <h2>Saved Recipes</h2>
      <div id="saved-recipes-list"></div>
    </div>
  </div>

  <!--
    SCRIPT LOAD ORDER (important):
    1. api-client.js   — API communication layer
    2. script.js       — legacy helpers + manual-recipe scaleRecipe fallback
    3. ui-controller.js — defines window.scaleRecipe (overrides script.js version)
    4. recipe-enhancements.js — UI enhancements
  -->
  <script src="api-client.js"></script>
  <script src="script.js"></script>
  <script src="ui-controller.js"></script>
  <script src="recipe-enhancements.js"></script>

  <script>
    // Mark that ui-controller is loaded so script.js helpers can detect it
    window._uiControllerLoaded = true;

    document.getElementById('enterRecipeManually').addEventListener('click', function () {
      window.location.href = 'enter_recipe.html';
    });

    window.addEventListener('DOMContentLoaded', function () {
      // Tab switching
      document.querySelectorAll('.search-tab').forEach(tab => {
        tab.addEventListener('click', function () {
          document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          const tabId = this.getAttribute('data-tab');
          document.getElementById(tabId).classList.add('active');
        });
      });

      // Quick scale logic
      window.setQuickScale = function(multiplier, btn) {
        document.querySelectorAll('.scale-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const customControls = document.getElementById('custom-scale-controls');
        if(customControls) customControls.style.display = 'none';
        
        // Trigger scale logic
        document.getElementById('scalingOption').value = 'servings';
        if (typeof updateScalingOptions === 'function') updateScalingOptions();
        document.getElementById('scalingValue').value = multiplier;
        if (typeof scaleRecipe === 'function') scaleRecipe();
      };
      
      window.showCustomScale = function(btn) {
        document.querySelectorAll('.scale-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const customControls = document.getElementById('custom-scale-controls');
        if(customControls) customControls.style.display = 'flex';
      };

      // Return from "Modify Scaling"
      if (sessionStorage.getItem('modifyingRecipe') === 'true') {
        sessionStorage.removeItem('modifyingRecipe');
        const youtubeLink = sessionStorage.getItem('youtubeVideoUrl');
        if (youtubeLink) {
          document.getElementById('youtubeLink').value = youtubeLink;
          if (typeof fetchIngredients === 'function') fetchIngredients();
        }
      }
    });
  </script>
</body>

</html>
